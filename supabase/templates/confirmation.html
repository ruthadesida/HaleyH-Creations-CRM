<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#f8f3ea;font-family:Arial,Helvetica,sans-serif;color:#23211e;">
    <div style="max-width:480px;margin:0 auto;background:#fffdf8;border:1px solid #e5ded2;border-radius:10px;padding:32px;">
      <p style="font-family:Georgia,serif;font-size:22px;margin:0 0 24px;">HaleyH Creations CRM</p>
      <p style="font-size:16px;line-height:1.5;margin:0 0 24px;">Confirm your email address to finish creating your account.</p>
      <p style="margin:0 0 24px;">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/workspaces"
           style="display:inline-block;background:#23211e;color:#f8f3ea;text-decoration:none;padding:14px 22px;border-radius:10px;font-size:16px;">
          Confirm email
        </a>
      </p>
      <p style="font-size:14px;line-height:1.5;color:#655e54;margin:0;">If you didn't sign up, you can ignore this email.</p>
    </div>
  </body>
</html>
