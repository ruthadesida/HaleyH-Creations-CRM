name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: every merged commit needs its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

# Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  database:
    name: Database tests (isolation, roles, money)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Start Postgres with all migrations applied
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db

  backup-restore:
    name: Backup and restore (Spec 2 test O)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Start Postgres with all migrations applied
        run: supabase db start
      - name: Build a business, back it up, wipe it, restore it, compare
        env:
          URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DB: supabase_db_HaleyH-Creations-CRM
        run: |
          set -euo pipefail
          psql "$URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/restore/seed.psql
          psql "$URL" -At -f supabase/tests/restore/snapshot.psql > before.txt
          # The backup: the same data dump the nightly Backup workflow takes (docs/BACKUPS.md).
          supabase db dump --local --data-only --use-copy -f data.sql
          grep -q 'COPY "public"."stock_movements"' data.sql || { echo "The dump has no business data"; exit 1; }
          grep -q 'COPY "auth"."users"' data.sql || { echo "The dump has no logins"; exit 1; }
          # Wipe: a fresh database from the migrations (stands in for restoring schema.sql into a new project),
          # then empty every table the dump will refill, as in a brand-new project.
          supabase db reset
          tables=$(grep -oE '^COPY "[a-z_]+"\."[a-z_0-9]+"' data.sql | cut -d' ' -f2 | sort -u | paste -sd, -)
          echo "Tables in the backup: $tables"
          docker exec "$DB" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "truncate $tables cascade"
          psql "$URL" -At -c "select count(*) from public.businesses" | grep -qx 0
          # Restore, exactly as the runbook says: one transaction, triggers off.
          # (Run as the local superuser: the local image doesn't let "postgres" write Supabase's internal storage tables.)
          docker cp data.sql "$DB:/tmp/data.sql"
          docker exec "$DB" psql -U supabase_admin -d postgres --single-transaction -v ON_ERROR_STOP=1 -q -c "set session_replication_role = replica" -f /tmp/data.sql
          psql "$URL" -At -f supabase/tests/restore/snapshot.psql > after.txt
          echo "Before: $(cat before.txt)"
          diff before.txt after.txt
          psql "$URL" -v ON_ERROR_STOP=1 -f supabase/tests/restore/check.psql

  build-and-e2e:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A throwaway local Supabase for the browser tests; never the real project.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Export Supabase settings
        run: |
          supabase status -o env > .supabase.env
          set -a; . ./.supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-}}"
            echo "SITE_URL=http://localhost:3100"
          } >> "$GITHUB_ENV"
          rm .supabase.env
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Worst-case data screenshots (e2e/worst-case.spec.ts) for design review. Test data only, from CI's local database.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worst-case-screens
          path: e2e-shots/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
