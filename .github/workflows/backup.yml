name: Backup

# Nightly encrypted backup of the live database (docs/BACKUPS.md).
# Does nothing until both secrets are set: SUPABASE_DB_URL (session pooler connection string) and BACKUP_PASSPHRASE.
# The repository is public, so backups are encrypted (AES-256) before they are stored as a workflow artifact.

on:
  schedule:
    - cron: "0 2 * * *" # 03:00 in Lagos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check configuration
        id: cfg
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Backups are not set up yet. Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets (see docs/BACKUPS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: 3.0.0
      - name: Dump roles, schema and data
        if: steps.cfg.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db dump --db-url "$DB_URL" --role-only -f roles.sql
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f data.sql
          ls -la *.sql
      - name: Encrypt
        if: steps.cfg.outputs.ready == 'true'
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="haleyh-backup-$(date -u +%Y-%m-%dT%H%M).tar.gz.gpg"
          # The passphrase goes through a file descriptor, never the command line (other processes can read that).
          tar czf - roles.sql schema.sql data.sql | gpg --batch --yes --pinentry-mode loopback --passphrase-file <(printf '%s' "$PASSPHRASE") \
            --symmetric --cipher-algo AES256 -o "$name"
          shred -u roles.sql schema.sql data.sql
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 30
      # GitHub emails the repository owner when a scheduled run fails; this makes the reason plain in the run summary.
      - name: Explain a failure
        if: failure()
        run: echo "::error::Tonight's backup failed. Check the steps above, then run it again from Actions → Backup → Run workflow (docs/BACKUPS.md)."
